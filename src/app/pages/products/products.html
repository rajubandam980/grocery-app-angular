<section class="products-page">

  <!-- HEADER -->

  <div class="products-header">

    <h1>
      All Products
    </h1>

    <p>
      Explore fresh groceries and essentials
    </p>

  </div>

  <!-- FILTERS -->

  <div class="filters">

    <input
      type="text"
      placeholder="Search products..."
    />

    <select>

      <option>
        All Categories
      </option>

      <option>
        Fruits
      </option>

      <option>
        Dairy
      </option>

      <option>
        Bakery
      </option>

    </select>

  </div>

  <!-- PRODUCTS -->

  <div class="products-grid">

<div
  class="product-card"
  *ngFor="let product of products"

>

      <img
        [src]="product.image"
        [alt]="product.name"
      />

      <div class="product-content">

        <h3>
          {{ product.name }}
        </h3>

        <p class="category">
          {{ product.category }}
        </p>

        <p class="description">
          {{ product.description }}
        </p>

        <div class="bottom-section">

          <p class="price">
            ${{ product.price }}
          </p>

          <button (click)="addToCart(product); $event.stopPropagation()">
            Add to Cart
          </button>
                    
        </div>

      </div>

    </div>

  </div>

</section>
