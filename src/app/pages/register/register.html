<section class="auth-page">

  <div class="auth-card">

    <h1>Create Account</h1>

    <form [formGroup]="registerForm"
          (ngSubmit)="onSubmit()">

      <input
        type="text"
        placeholder="Full Name"
        formControlName="name"
      />

      <input
        type="email"
        placeholder="Email"
        formControlName="email"
      />

      <input
        type="password"
        placeholder="Password"
        formControlName="password"
      />

      <button type="submit">
        Register
      </button>

    </form>

  </div>

</section>
